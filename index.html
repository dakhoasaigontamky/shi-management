const QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4'];
// So sánh 2 giá trị "Kì" để sắp xếp: Q1-Q4 theo đúng thứ tự, các kì tự đặt (thanh tra, kiểm toán đột xuất...) xếp sau, theo alphabet
function compareKi(a, b) {
  const ia = QUARTERS.indexOf(a), ib = QUARTERS.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  if (ia >= 0) return -1;
  if (ib >= 0) return 1;
  return String(a || '').localeCompare(String(b || ''), 'vi');
}
function allKiValues() {
  const set = new Set(QUARTERS);
  state.periods.forEach((p) => set.add(p.quarter));
  state.lines.forEach((l) => set.add(l.quarter));
  return Array.from(set).filter(Boolean).sort(compareKi);
}

const fmtVND = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : new Intl.NumberFormat('vi-VN').format(Math.round(n));
function parseMoney(str) {

const fmtPct = (n) => (n === null || n === undefined || !isFinite(n)) ? '—' : (n * 100).toFixed(2) + '%';
const qKey = (q, y) => `${q}-${y}`;
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function normalizeQuarter(raw) {
  const s = String(raw || '').trim().toLowerCase();
  if (s.includes('iv') || s === 'q4' || s === '4') return 'Q4';
  if (s.includes('iii') || s === 'q3' || s === '3') return 'Q3';
  if (s.includes('ii') || s === 'q2' || s === '2') return 'Q2';
  if (s.includes('i') || s === 'q1' || s === '1') return 'Q1';
  return String(raw || '').trim();
}
// Chuẩn hoá khoa/tên người: gộp theo chữ thường không phân biệt hoa/thường, hiển thị theo biến thể xuất hiện nhiều nhất
function buildNormalizer(values) {
  const counts = new Map();
  values.forEach((v) => {
    const raw = String(v || '').trim();
    if (!raw) return;
    const key = raw.toLowerCase();
    if (!counts.has(key)) counts.set(key, new Map());
    const m = counts.get(key);
    m.set(raw, (m.get(raw) || 0) + 1);
  });
  const canonical = new Map();
  counts.forEach((m, key) => {
    let best = null, bestN = -1;
    m.forEach((n, text) => { if (n > bestN) { best = text; bestN = n; } });
    canonical.set(key, best);
  });
  return (v) => {
    const raw = String(v || '').trim();
    if (!raw) return '';
    return canonical.get(raw.toLowerCase()) || raw;
  };
}

// ---------------------------------------------------------------
// DATA LOADING
// ---------------------------------------------------------------
// Supabase mặc định chỉ trả về tối đa 1000 dòng/lần gọi — hàm này tự lấy theo từng đợt cho đến khi hết,
// để không bị "mất" dữ liệu khi bảng có hơn 1000 dòng.
async function fetchAllRows(table, orderCols, filterFn) {
  const PAGE = 1000;
  let all = [];
  let from = 0;
  while (true) {
    let q = sb.from(table).select('*');
    if (filterFn) q = filterFn(q);
    q = q.range(from, from + PAGE - 1);
    (orderCols || []).forEach((c) => { q = q.order(c); });
    const { data, error } = await q;
    if (error) { console.error('fetchAllRows lỗi', table, error); break; }
    all = all.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

async function loadAll() {
  const [lines, trash, pers, cats, refs, aliases, khoaAliases] = await Promise.all([
    fetchAllRows('bhyt_lines', null, (q) => q.is('deleted_at', null)),
    fetchAllRows('bhyt_lines', ['deleted_at'], (q) => q.not('deleted_at', 'is', null)),
    fetchAllRows('bhyt_periods', ['year', 'quarter']),
    fetchAllRows('bhyt_categories', ['code']),
    fetchAllRows('bhyt_reference', ['phu_luc', 'stt']),
    fetchAllRows('bhyt_code_aliases', ['alias_code']),
    fetchAllRows('bhyt_khoa_aliases', ['alias_name']),
  ]);
  state.lines = lines || [];
  state.trash = trash || [];
  state.periods = pers || [];
  state.categories = cats || [];
  state.reference = refs || [];
  state.codeAliases = aliases || [];
  state.khoaAliases = khoaAliases || [];
  state.khoaNorm = buildKhoaNormalizer();
  state.bacSiNorm = buildNormalizer(state.lines.map((l) => l.individual));
  state.remediatorNorm = buildNormalizer(state.lines.map((l) => l.remediator));
}
// Quy 1 tên Khoa về đúng tên chuẩn đã khai báo trong Ánh xạ tên Khoa (nếu có), giữ nguyên nếu chưa khai báo
function resolveKhoaAlias(name) {
  const n = String(name || '').trim();
  if (!n) return n;
  const alias = state.khoaAliases.find((a) => a.alias_name === n);
  return alias ? alias.canonical_name : n;
}
// Chuẩn hoá tên Khoa: gộp hoa/thường trước (buildNormalizer), rồi áp ánh xạ thủ công (bhyt_khoa_aliases)
function buildKhoaNormalizer() {
  const caseNorm = buildNormalizer(state.lines.map((l) => l.department));
  return (raw) => resolveKhoaAlias(caseNorm(raw));
}

// Quy 1 mã Phụ lục về đúng mã chuẩn đã khai báo trong Ánh xạ mã chuyên đề (nếu có), giữ nguyên nếu chưa khai báo
function resolveCode(rawCode) {
  const c = String(rawCode || '').trim();
  if (!c) return c;
  const alias = state.codeAliases.find((a) => a.alias_code === c);
  return alias ? alias.canonical_code : c;
}

// ---------------------------------------------------------------
// DERIVED DATA — core aggregates
// ---------------------------------------------------------------
function quarterList() {
  const map = new Map();
  state.periods.forEach((p) => map.set(qKey(p.quarter, p.year), { quarter: p.quarter, year: p.year, revenue: p.revenue || 0 }));
  state.lines.forEach((l) => {
    const k = qKey(l.quarter, l.year);
    if (!map.has(k)) map.set(k, { quarter: l.quarter, year: l.year, revenue: 0 }); // có dữ liệu nhưng chưa nhập doanh thu — vẫn hiển thị, doanh thu tạm để 0
  });
  return Array.from(map.values()).map((v) => ({ ...v, key: qKey(v.quarter, v.year) }))
    .sort((a, b) => a.year - b.year || compareKi(a.quarter, b.quarter));
}
function quarterSummaries(sourceRows) {
  const src = sourceRows || state.lines;
  const qs = quarterList();
  return qs.map((p) => {
    const rows = src.filter((l) => l.quarter === p.quarter && l.year === p.year);
    const finalizedCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
    return {
      key: p.key, label: `${p.quarter}/${p.year}`, quarter: p.quarter, year: p.year,
      revenue: p.revenue, finalizedCost, lineCount: rows.length,
      rateVsRevenue: p.revenue ? finalizedCost / p.revenue : null,
    };
  });
}
function availableYears() { return Array.from(new Set(state.periods.map((p) => p.year))).sort((a, b) => a - b); }

function filteredQuarterSummaries() {
  let qs = quarterSummaries();
  if (state.dashYear !== 'ALL') qs = qs.filter((q) => q.year === Number(state.dashYear));
  if (state.dashQuarter !== 'ALL') qs = qs.filter((q) => q.quarter === state.dashQuarter);
  return qs;
}
function grandTotal(qs) {
  const revenue = qs.reduce((s, q) => s + q.revenue, 0);
  const finalizedCost = qs.reduce((s, q) => s + q.finalizedCost, 0);
  const lineCount = qs.reduce((s, q) => s + q.lineCount, 0);
  return { revenue, finalizedCost, lineCount, rateVsRevenue: revenue ? finalizedCost / revenue : null };
}
function currentAndPreviousPeriod() {
  const all = quarterSummaries();
  if (all.length === 0) return { current: null, previous: null, all, idx: -1 };
  const filtered = filteredQuarterSummaries();
  const current = filtered.length ? filtered[filtered.length - 1] : all[all.length - 1];
  const idx = all.findIndex((q) => q.key === current.key);
  const previous = idx > 0 ? all[idx - 1] : null;
  return { current, previous, idx, all };
}

function categoryNameOf(code) {
  const c = state.categories.find((x) => x.code === code);
  return c ? c.name : '';
}
function categoryGroupOf(code) {
  const c = state.categories.find((x) => x.code === code);
  return (c && c.category_group) ? c.category_group : '(chưa phân nhóm)';
}

function categorySummaries(sourceRows) {
  const src = sourceRows || state.lines;
  const byCode = new Map();
  src.forEach((l) => {
    if (!l.code) return;
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, name: categoryNameOf(l.code) || l.error_desc || '', finalizedCost: 0, lineCount: 0, quarters: new Set() });
    const rec = byCode.get(l.code);
    rec.finalizedCost += l.cost || 0;
    rec.lineCount += 1;
    rec.quarters.add(qKey(l.quarter, l.year));
  });
  return Array.from(byCode.values()).map((r) => ({ ...r, quarterCount: r.quarters.size }));
}

function groupTotalsForQuarter(q, sourceRows) {
  if (!q) return {};
  const src = sourceRows || state.lines;
  const totals = {};
  src.filter((l) => l.quarter === q.quarter && l.year === q.year).forEach((l) => {
    const g = categoryGroupOf(l.code);
    totals[g] = (totals[g] || 0) + (l.cost || 0);
  });
  return totals;
}
function groupCostBreakdown() {
  const totals = {};
  scopedLines().forEach((l) => {
    const g = categoryGroupOf(l.code);
    totals[g] = (totals[g] || 0) + (l.cost || 0);
  });
  return totals;
}

function currentPeriodAlerts() {
  const { current, all, idx } = currentAndPreviousPeriod();
  if (!current) return null;
  const priorKeys = new Set(all.slice(0, idx).map((q) => q.key));
  const priorCodes = new Set(state.lines.filter((l) => priorKeys.has(qKey(l.quarter, l.year))).map((l) => l.code));
  const currentRows = state.lines.filter((l) => qKey(l.quarter, l.year) === current.key);
  const currentCodes = Array.from(new Set(currentRows.map((l) => l.code)));
  const newCodes = currentCodes.filter((c) => !priorCodes.has(c)).map((c) => ({ code: c, name: categoryNameOf(c) }));
  const repeatedCodes = currentCodes.filter((c) => priorCodes.has(c)).map((c) => ({ code: c, name: categoryNameOf(c) }));
  const causeCounts = {};
  currentRows.forEach((l) => { const c = l.cause || 'Chưa xác định'; causeCounts[c] = (causeCounts[c] || 0) + 1; });
  return { current, newCodes, repeatedCodes, causeCounts, totalRows: currentRows.length };
}

function paretoData(metric, scope, topN) {
  let rows = scope === 'filtered' ? scopedLines() : state.lines;
  const byCode = new Map();
  rows.forEach((l) => {
    if (!l.code) return;
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, value: 0 });
    byCode.get(l.code).value += metric === 'cost' ? (l.cost || 0) : 1;
  });
  const sorted = Array.from(byCode.values()).filter((r) => r.value > 0).sort((a, b) => b.value - a.value).slice(0, topN);
  const total = Array.from(byCode.values()).reduce((s, r) => s + r.value, 0);
  let cum = 0;
  return sorted.map((r) => { cum += r.value; return { ...r, cumPct: total ? (cum / total) * 100 : 0 }; });
}

function khoaNormalizer() { return state.khoaNorm || buildKhoaNormalizer(); }
function bacSiNormalizer() { return state.bacSiNorm || buildNormalizer(state.lines.map((l) => l.individual)); }
function remediatorNormalizer() { return state.remediatorNorm || buildNormalizer(state.lines.map((l) => l.remediator)); }
function khoaList() { const n = khoaNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.department)).filter(Boolean))).sort(); }
function bacSiList() { const n = bacSiNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.individual)).filter(Boolean))).sort(); }
function remediatorList() { const n = remediatorNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.remediator)).filter(Boolean))).sort(); }
function nhomList() { return Array.from(new Set(state.categories.map((c) => c.category_group).filter(Boolean))).sort(); }

// Áp dụng toàn bộ bộ lọc (năm/kỳ/khoa/bác sĩ/nhóm lỗi/nguyên nhân/người khắc phục/tìm kiếm chuyên đề) lên danh sách dòng dữ liệu gốc
function categoryMatchesSearch(code) {
  const q = state.overviewCatSearch.trim().toLowerCase();
  if (!q) return true;
  const name = (categoryNameOf(code) || '').toLowerCase();
  return (code || '').toLowerCase().includes(q) || name.includes(q);
}
function scopedLines() {
  const nKhoa = khoaNormalizer(), nBacSi = bacSiNormalizer(), nRem = remediatorNormalizer();
  let rows = state.lines;
  if (state.dashYear !== 'ALL') rows = rows.filter((l) => l.year === Number(state.dashYear));
  if (state.dashQuarter !== 'ALL') rows = rows.filter((l) => l.quarter === state.dashQuarter);
  if (state.filterKhoa !== 'ALL') rows = rows.filter((l) => nKhoa(l.department) === state.filterKhoa);
  if (state.filterBacSi !== 'ALL') rows = rows.filter((l) => nBacSi(l.individual) === state.filterBacSi);
  if (state.filterNhom !== 'ALL') rows = rows.filter((l) => categoryGroupOf(l.code) === state.filterNhom);
  if (state.filterCause !== 'ALL') rows = rows.filter((l) => (l.cause || '') === state.filterCause);
  if (state.filterRemediator !== 'ALL') rows = rows.filter((l) => nRem(l.remediator) === state.filterRemediator);
  rows = rows.filter((l) => categoryMatchesSearch(l.code));
  return rows;
}
// Giống scopedLines nhưng KHÔNG lọc theo 1 Kì cụ thể — dùng cho các biểu đồ xu hướng nhiều kì ở Tổng quan
function overviewTrendScope() {
  const nKhoa = khoaNormalizer(), nBacSi = bacSiNormalizer(), nRem = remediatorNormalizer();
  let rows = state.lines;
  if (state.dashYear !== 'ALL') rows = rows.filter((l) => l.year === Number(state.dashYear));
  if (state.filterKhoa !== 'ALL') rows = rows.filter((l) => nKhoa(l.department) === state.filterKhoa);
  if (state.filterBacSi !== 'ALL') rows = rows.filter((l) => nBacSi(l.individual) === state.filterBacSi);
  if (state.filterNhom !== 'ALL') rows = rows.filter((l) => categoryGroupOf(l.code) === state.filterNhom);
  if (state.filterCause !== 'ALL') rows = rows.filter((l) => (l.cause || '') === state.filterCause);
  if (state.filterRemediator !== 'ALL') rows = rows.filter((l) => nRem(l.remediator) === state.filterRemediator);
  rows = rows.filter((l) => categoryMatchesSearch(l.code));
  return rows;
}
function scopedTotals() {
  const rows = scopedLines();
  const finalizedCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
  const lineCount = rows.length;
  let revenue = filteredQuarterSummaries().reduce((s, q) => s + q.revenue, 0);
  return { finalizedCost, lineCount, revenue, rateVsRevenue: revenue ? finalizedCost / revenue : null };
}

// ---------------------------------------------------------------
// DERIVED DATA — Khoa / Cá nhân heatmap
// ---------------------------------------------------------------
function heatmapData(mode, axis, metric, cause) {
  const field = mode === 'department' ? 'department' : 'individual';
  const normalize = mode === 'department' ? khoaNormalizer() : bacSiNormalizer();
  let baseLines = state.lines;
  if (cause && cause !== 'ALL') baseLines = baseLines.filter((l) => (l.cause || '') === cause);
  const rows = baseLines.map((l) => ({ ...l, _entity: normalize(l[field]) })).filter((l) => l._entity);

  const entities = Array.from(new Set(rows.map((r) => r._entity)));
  const axisKeys = axis === 'quarter'
    ? quarterSummaries().map((q) => q.key)
    : Array.from(new Set(rows.map((r) => r.code).filter(Boolean)));
  const axisLabels = axis === 'quarter'
    ? quarterSummaries().map((q) => q.label)
    : axisKeys.map((c) => c);

  const matrix = entities.map((ent) => {
    const rowVals = axisKeys.map((ak) => {
      const subset = rows.filter((r) => r._entity === ent && (axis === 'quarter' ? qKey(r.quarter, r.year) === ak : r.code === ak));
      return metric === 'cost' ? subset.reduce((s, r) => s + (r.cost || 0), 0) : subset.length;
    });
    const total = rowVals.reduce((s, v) => s + v, 0);
    const quarterCount = new Set(rows.filter((r) => r._entity === ent).map((r) => qKey(r.quarter, r.year))).size;
    return { entity: ent, values: rowVals, total, quarterCount };
  }).sort((a, b) => b.total - a.total);

  return { entities: matrix, axisKeys, axisLabels };
}

// DERIVED DATA — Risk Score
// ---------------------------------------------------------------
function zoneForMoney(cost) {
  if (cost === 0) return 'green';
  if (cost <= 2000000) return 'yellow';
  return 'red';
}
function zoneForCause(caNhanRatio) {
  return caNhanRatio > 0 ? 'red' : 'yellow';
}
function zoneForCount(n) {
  if (n <= 5) return 'green';
  if (n <= 10) return 'yellow';
  return 'red';
}

function riskScoreForQuarter(qKeyStr) {
  const rows = state.lines.filter((l) => qKey(l.quarter, l.year) === qKeyStr && l.code);

  const byCode = new Map();
  rows.forEach((l) => {
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, name: categoryNameOf(l.code), cost: 0, lines: 0, caNhan: 0 });
    const rec = byCode.get(l.code);
    rec.cost += l.cost || 0;
    rec.lines += 1;
    if (l.cause === 'Cá nhân') rec.caNhan += 1;
  });

  return Array.from(byCode.values()).map((rec) => {
    const caNhanRatio = rec.lines ? rec.caNhan / rec.lines : 0;
    const moneyZone = zoneForMoney(rec.cost);
    const causeZone = zoneForCause(caNhanRatio);
    const countZone = zoneForCount(rec.lines);
    const redCount = [moneyZone, causeZone, countZone].filter((z) => z === 'red').length;
    let level = 'green', label = 'Theo dõi';
    if (redCount === 1) { level = 'yellow'; label = 'Xem xét can thiệp'; }
    else if (redCount >= 2) { level = 'red'; label = 'Can thiệp ngay'; }
    return { ...rec, caNhanRatio, moneyZone, causeZone, countZone, redCount, level, label };
  }).sort((a, b) => b.redCount - a.redCount || b.cost - a.cost);
}

function overviewCatSearchAnalyze(term) {
  const q = term.trim().toLowerCase();
  if (!q) return null;
  const rows = overviewTrendScope(); // đã lọc đúng theo search term này + mọi bộ lọc khác đang bật
  if (rows.length === 0) return { mode: 'none' };
  const matchingCodes = Array.from(new Set(rows.map((l) => l.code).filter(Boolean)));
  if (matchingCodes.length === 0) return { mode: 'none' };
  const map = new Map();
  rows.forEach((l) => {
    const k = qKey(l.quarter, l.year);
    if (!map.has(k)) map.set(k, { key: k, label: `${l.quarter}/${l.year}`, quarter: l.quarter, year: l.year, cost: 0, count: 0 });
    const r = map.get(k);
    r.cost += l.cost || 0;
    r.count += 1;
  });
  const series = Array.from(map.values()).sort((a, b) => a.year - b.year || compareKi(a.quarter, b.quarter));
  return { mode: 'found', codes: matchingCodes, rows, series };
}

// Plugin dùng chung cho biểu đồ tròn: đưa % ra ngoài rìa, kèm đường dẫn nối về đúng phần, chữ màu đen
function outsideLabelPlugin() {
  return {
    id: 'outsideLabelPlugin',
    afterDraw(chart) {
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const dataArr = chart.data.datasets[0].data;
      const total = dataArr.reduce((a, b) => a + b, 0);
      if (!total) return;
      meta.data.forEach((arc, i) => {
        const value = dataArr[i];
        if (!value) return;
        const pct = ((value / total) * 100).toFixed(1) + '%';
        const angle = (arc.startAngle + arc.endAngle) / 2;
        const cx = arc.x, cy = arc.y;
        const outerR = arc.outerRadius;
        const x1 = cx + Math.cos(angle) * outerR;
        const y1 = cy + Math.sin(angle) * outerR;
        const midR = outerR + 14;
        const x2 = cx + Math.cos(angle) * midR;
        const y2 = cy + Math.sin(angle) * midR;
        const dir = Math.cos(angle) >= 0 ? 1 : -1;
        const x3 = x2 + dir * 16;
        ctx.save();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y2);
        ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = dir > 0 ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(pct, x3 + dir * 3, y2);
        ctx.restore();
      });
    },
  };
}

function heatCellColor(value, max, metric) {
  if (!max || value <= 0) return 'background-color:#f8fafc;color:#cbd5e1;';
  const pct = Math.min(1, value / max);
  const base = metric === 'cost' ? [234, 88, 12] : [30, 58, 138]; // cam dịu cho chi phí, navy cho số lượt
  const alpha = 0.10 + pct * 0.6;
  return `background-color:rgba(${base[0]},${base[1]},${base[2]},${alpha.toFixed(2)});color:${pct > 0.55 ? '#fff' : '#1e293b'};`;
}

// Phân tích ô tìm kiếm ở tab Khoa & Cá nhân: tự nhận diện đang tìm chuyên đề hay tìm người/khoa,
// áp dụng đúng các bộ lọc đang bật (Overview filters + Nguyên nhân riêng của tab này)
// Gộp dữ liệu tìm kiếm theo đúng chiều tương ứng (Khoa/Cá nhân cho mode 'category', Chuyên đề cho mode 'individual'/'department'),
// kèm số kì (quý) xuất hiện — để trả lời "ai/chuyên đề nào lặp lại qua mấy kì"
function computeSearchGroups(mode, rows) {
  const keyFn = mode === 'category'
    ? (state.heatmapMode === 'department' ? (l) => khoaNormalizer()(l.department) : (l) => bacSiNormalizer()(l.individual))
    : (l) => l.code;
  const map = new Map();
  rows.forEach((l) => {
    const k = keyFn(l);
    if (!k) return;
    if (!map.has(k)) map.set(k, { key: k, cost: 0, count: 0, quarters: new Set() });
    const rec = map.get(k);
    rec.cost += l.cost || 0;
    rec.count += 1;
    rec.quarters.add(qKey(l.quarter, l.year));
  });
  return Array.from(map.values()).map((r) => ({ key: r.key, cost: r.cost, count: r.count, quarterCount: r.quarters.size }))
    .sort((a, b) => b.quarterCount - a.quarterCount || b.cost - a.cost);
}

function heatmapSearchAnalyze(term) {
  const q = term.trim().toLowerCase();
  if (!q) return null;
  let rows = scopedLines();
  if (state.heatmapCause !== 'ALL') rows = rows.filter((l) => (l.cause || '') === state.heatmapCause);

  const matchingCodes = new Set();
  rows.forEach((l) => {
    if (!l.code) return;
    const name = (categoryNameOf(l.code) || '').toLowerCase();
    if (l.code.toLowerCase().includes(q) || name.includes(q)) matchingCodes.add(l.code);
  });
  if (matchingCodes.size > 0) {
    const subset = rows.filter((l) => matchingCodes.has(l.code));
    return { mode: 'category', codes: Array.from(matchingCodes), rows: subset, groups: computeSearchGroups('category', subset) };
  }

  const nBacSi = bacSiNormalizer();
  const matchingIndividuals = new Set();
  rows.forEach((l) => { const n = nBacSi(l.individual); if (n && n.toLowerCase().includes(q)) matchingIndividuals.add(n); });
  if (matchingIndividuals.size > 0) {
    const subset = rows.filter((l) => matchingIndividuals.has(nBacSi(l.individual)));
    return { mode: 'individual', names: Array.from(matchingIndividuals), rows: subset, groups: computeSearchGroups('individual', subset) };
  }

  const nKhoa = khoaNormalizer();
  const matchingDepts = new Set();
  rows.forEach((l) => { const n = nKhoa(l.department); if (n && n.toLowerCase().includes(q)) matchingDepts.add(n); });
  if (matchingDepts.size > 0) {
    const subset = rows.filter((l) => matchingDepts.has(nKhoa(l.department)));
    return { mode: 'department', names: Array.from(matchingDepts), rows: subset, groups: computeSearchGroups('department', subset) };
  }

  return { mode: 'none', rows: [] };
}

const PHU_LUC_LABELS = {

  'PTTT': 'PL4 · Phẫu thuật thủ thuật', 'CĐHA': 'PL5 · Chẩn đoán hình ảnh', 'XÉT NGHIỆM': 'PL6 · Xét nghiệm',
  'THUỐC': 'PL7 · Thuốc', 'VTYT': 'PL8 · Vật tư y tế', 'DỮ LIỆU, THỦ TỤC HC': 'PL9 · Dữ liệu, thủ tục HC',
};
const SOURCE_OPTIONS = ['BHYT chính thức', 'DKTK', 'Tham khảo BV khác'];
const SOURCE_COLORS = {
  'BHYT chính thức': 'bg-blue-50 text-blue-700 border-blue-200',
  'DKTK': 'bg-amber-50 text-amber-700 border-amber-200',
  'Tham khảo BV khác': 'bg-purple-50 text-purple-700 border-purple-200',
};
function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br/>'); }

function referenceHTML() {
  const canEdit = state.role === 'editor';
  const groups = Array.from(new Set(state.reference.map((r) => r.phu_luc).filter(Boolean)));
  const sources = Array.from(new Set(state.reference.map((r) => r.source).filter(Boolean)));
  const q = state.refSearch.trim().toLowerCase();
  let rows = state.reference;
  if (state.refGroup !== 'ALL') rows = rows.filter((r) => r.phu_luc === state.refGroup);
  if (state.refSource !== 'ALL') rows = rows.filter((r) => r.source === state.refSource);
  if (q) rows = rows.filter((r) => [r.name, r.category_group, r.legal_basis, r.payment_basis, r.audit_rule, r.note].some((f) => (f || '').toLowerCase().includes(q)));

  return `
    <div class="mb-4">
      <p class="text-sm text-slate-500 mb-3">Tra cứu ${state.reference.length} chuyên đề — gồm chuyên đề chính thức BHYT, chuyên đề thực tế DKTK từng gặp, và tham khảo từ nguồn khác.</p>
      <div class="flex flex-wrap gap-2 items-center">
        <input id="ref-search" type="text" placeholder="Tìm theo tên, cơ sở pháp lý, quy tắc, ghi chú..." value="${escapeHtml(state.refSearch)}" class="border border-slate-300 rounded-md px-3 py-2 text-sm flex-1 min-w-[240px]" />
        <select id="ref-group" class="border border-slate-300 rounded-md px-2 py-2 text-sm bg-white">
          <option value="ALL" ${state.refGroup === 'ALL' ? 'selected' : ''}>Tất cả phụ lục/nhóm</option>
          ${groups.map((g) => `<option value="${escapeHtml(g)}" ${state.refGroup === g ? 'selected' : ''}>${escapeHtml(PHU_LUC_LABELS[g] || g)}</option>`).join('')}
        </select>
        <select id="ref-source" class="border border-slate-300 rounded-md px-2 py-2 text-sm bg-white">
          <option value="ALL" ${state.refSource === 'ALL' ? 'selected' : ''}>Tất cả nguồn</option>
          ${sources.map((s) => `<option value="${escapeHtml(s)}" ${state.refSource === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        ${canEdit ? `<button id="btn-ref-add" class="bg-blue-900 text-white rounded-md px-3 py-2 text-sm font-medium hover:bg-blue-800">+ Thêm chuyên đề</button>` : ''}
      </div>
    </div>
    ${state.refAdding ? refFormHTML(null) : ''}
    <div class="text-xs text-slate-400 mb-2">${rows.length} kết quả</div>
    <div class="space-y-2">
      ${rows.length === 0 ? '<div class="text-sm text-slate-400 py-10 text-center bg-white border border-slate-200 rounded-lg">Không tìm thấy chuyên đề phù hợp</div>' : rows.map((r) => refItemHTML(r, canEdit)).join('')}
    </div>
  `;
}

function refFormHTML(r) {
  const v = r || { phu_luc: '', category_group: '', name: '', source: 'DKTK', legal_basis: '', payment_basis: '', audit_rule: '', note: '' };
  const idAttr = r ? `data-ref-form-id="${r.id}"` : `data-ref-form-id="new"`;
  return `
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-3" ${idAttr}>
      <div class="grid md:grid-cols-2 gap-3 mb-3">
        <div><label class="text-xs text-slate-600">Tên chuyên đề *</label><input data-rf="name" type="text" value="${escapeHtml(v.name)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Nguồn chuyên đề</label><select data-rf="source" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm bg-white">${SOURCE_OPTIONS.map((s) => `<option value="${s}" ${v.source === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div><label class="text-xs text-slate-600">Phụ lục / Nhóm (tự do)</label><input data-rf="phu_luc" type="text" value="${escapeHtml(v.phu_luc)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Nhóm chi tiết (tuỳ chọn)</label><input data-rf="category_group" type="text" value="${escapeHtml(v.category_group)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
      </div>
      <div class="space-y-2 mb-3">
        <div><label class="text-xs text-slate-600">Cơ sở pháp lý</label><textarea data-rf="legal_basis" rows="2" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm">${escapeHtml(v.legal_basis)}</textarea></div>
        <div><label class="text-xs text-slate-600">Cơ sở thanh toán</label><textarea data-rf="payment_basis" rows="2" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm">${escapeHtml(v.payment_basis)}</textarea></div>
        <div><label class="text-xs text-slate-600">Quy tắc giám định</label><textarea data-rf="audit_rule" rows="2" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm">${escapeHtml(v.audit_rule)}</textarea></div>
        <div><label class="text-xs text-slate-600">Ghi chú / Kinh nghiệm xử lý</label><textarea data-rf="note" rows="2" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm">${escapeHtml(v.note)}</textarea></div>
      </div>
      <div class="flex gap-2">
        <button data-ref-save="${r ? r.id : 'new'}" class="bg-blue-900 text-white rounded-md px-3 py-1.5 text-sm font-medium hover:bg-blue-800">Lưu</button>
        <button data-ref-cancel="${r ? r.id : 'new'}" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm">Huỷ</button>
      </div>
    </div>`;
}

function refItemHTML(r, canEdit) {
  const expanded = state.refExpanded.has(String(r.id));
  if (state.refEditingId === r.id) return refFormHTML(r);
  return `
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <button data-ref-toggle="${r.id}" class="w-full text-left px-4 py-3 flex items-start justify-between gap-3 hover:bg-slate-50">
        <div>
          ${r.phu_luc ? `<span class="text-[11px] font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded px-1.5 py-0.5 mr-1">${escapeHtml(PHU_LUC_LABELS[r.phu_luc] || r.phu_luc)}</span>` : ''}
          ${r.source ? `<span class="text-[11px] font-medium rounded px-1.5 py-0.5 mr-2 border ${SOURCE_COLORS[r.source] || 'bg-slate-50 text-slate-600 border-slate-200'}">${escapeHtml(r.source)}</span>` : ''}
          <span class="text-sm font-medium text-slate-800">${escapeHtml(r.name)}</span>
        </div>
        <span class="text-slate-400 text-sm shrink-0">${expanded ? '▲' : '▼'}</span>
      </button>
      ${expanded ? `
        <div class="px-4 pb-4 pt-1 border-t border-slate-100 space-y-3 text-sm">
          ${r.legal_basis ? `<div><div class="text-xs font-semibold text-slate-500 uppercase mb-1">Cơ sở pháp lý</div><div class="text-slate-700 whitespace-pre-line">${nl2br(r.legal_basis)}</div></div>` : ''}
          ${r.payment_basis ? `<div><div class="text-xs font-semibold text-slate-500 uppercase mb-1">Cơ sở thanh toán</div><div class="text-slate-700 whitespace-pre-line">${nl2br(r.payment_basis)}</div></div>` : ''}
          ${r.audit_rule ? `<div><div class="text-xs font-semibold text-slate-500 uppercase mb-1">Quy tắc giám định</div><div class="text-slate-700 whitespace-pre-line">${nl2br(r.audit_rule)}</div></div>` : ''}
          ${r.note ? `<div><div class="text-xs font-semibold text-slate-500 uppercase mb-1">Ghi chú / Kinh nghiệm xử lý</div><div class="text-slate-700 whitespace-pre-line">${nl2br(r.note)}</div></div>` : ''}
          ${canEdit ? `<div class="flex gap-3 pt-1"><button data-ref-edit="${r.id}" class="text-xs text-blue-700 hover:underline">Sửa</button><button data-ref-delete="${r.id}" class="text-xs text-red-600 hover:underline">Xoá</button></div>` : ''}
        </div>` : ''}
    </div>`;
}

// ---------------------------------------------------------------
// EVENT WIRING
// ---------------------------------------------------------------
function attachTabEvents() {
  if (state.tab === 'overview') {
    const catSearchEl = document.getElementById('overview-cat-search');
    if (catSearchEl) {
      catSearchEl.addEventListener('input', (e) => { state.overviewCatSearch = e.target.value; renderTab(); });
      const val = catSearchEl.value; catSearchEl.focus(); catSearchEl.value = ''; catSearchEl.value = val;
    }
    const yearEl = document.getElementById('dash-year');
    if (yearEl) yearEl.onchange = (e) => { state.dashYear = e.target.value; renderTab(); };
    const quarterEl = document.getElementById('dash-quarter');
    if (quarterEl) quarterEl.onchange = (e) => { state.dashQuarter = e.target.value; renderTab(); };
    const khoaEl = document.getElementById('filter-khoa');
    if (khoaEl) khoaEl.onchange = (e) => { state.filterKhoa = e.target.value; renderTab(); };
    const bsEl = document.getElementById('filter-bacsi');
    if (bsEl) bsEl.onchange = (e) => { state.filterBacSi = e.target.value; renderTab(); };
    const nhomEl = document.getElementById('filter-nhom');
    if (nhomEl) nhomEl.onchange = (e) => { state.filterNhom = e.target.value; renderTab(); };
    const causeEl = document.getElementById('filter-cause');
    if (causeEl) causeEl.onchange = (e) => { state.filterCause = e.target.value; renderTab(); };
    const remEl = document.getElementById('filter-remediator');
    if (remEl) remEl.onchange = (e) => { state.filterRemediator = e.target.value; renderTab(); };
    document.querySelectorAll('[data-pareto-scope]').forEach((btn) => { btn.onclick = () => { state.paretoScope = btn.dataset.paretoScope; renderTab(); }; });
  }
  if (state.tab === 'details') {
    const filterEl = document.getElementById('quarter-filter');
    if (filterEl) filterEl.onchange = (e) => { state.quarterFilter = e.target.value; state.detailsPage = 1; renderTab(); };
    const searchEl = document.getElementById('details-search');
    if (searchEl) {
      searchEl.addEventListener('input', (e) => { state.detailsSearch = e.target.value; state.detailsPage = 1; renderTab(); });
      const val = searchEl.value; searchEl.focus(); searchEl.value = ''; searchEl.value = val;
    }
    const addBtn = document.getElementById('btn-add-line');
    if (addBtn) addBtn.onclick = addLineRow;
    const bulkDelBtn = document.getElementById('btn-bulk-delete');
    if (bulkDelBtn) bulkDelBtn.onclick = bulkDeleteVisibleLines;
    const blankDelBtn = document.getElementById('btn-delete-blank');
    if (blankDelBtn) blankDelBtn.onclick = deleteBlankLines;
    const prevBtn = document.getElementById('btn-page-prev');
    if (prevBtn) prevBtn.onclick = () => { state.detailsPage -= 1; renderTab(); };
    const nextBtn = document.getElementById('btn-page-next');
    if (nextBtn) nextBtn.onclick = () => { state.detailsPage += 1; renderTab(); };
    document.querySelectorAll('#tab-content tr[data-id]').forEach((tr) => {
      tr.querySelectorAll('[data-field]').forEach((input) => input.addEventListener('change', () => saveLineField(tr.dataset.id, input.dataset.field, input.value)));
      const delBtn = tr.querySelector('[data-del-line]');
      if (delBtn) delBtn.onclick = () => deleteLineRow(tr.dataset.id);
    });
  }
  if (state.tab === 'heatmap') {
    document.querySelectorAll('[data-hm]').forEach((btn) => {
      btn.onclick = () => {
        const [key, val] = btn.dataset.hm.split(':');
        if (key === 'mode') state.heatmapMode = val;
        if (key === 'axis') state.heatmapAxis = val;
        if (key === 'metric') state.heatmapMetric = val;
        if (key === 'cause') state.heatmapCause = val;
        renderTab();
      };
    });
    const hmSearchEl = document.getElementById('heatmap-search');
    if (hmSearchEl) {
      hmSearchEl.addEventListener('input', (e) => { state.heatmapSearch = e.target.value; renderTab(); });
      const val = hmSearchEl.value; hmSearchEl.focus(); hmSearchEl.value = ''; hmSearchEl.value = val;
    }
  }
  if (state.tab === 'risk') {
    const rq = document.getElementById('risk-quarter');
    if (rq) rq.onchange = (e) => { state.riskQuarterKey = e.target.value; renderTab(); };
  }
  if (state.tab === 'setup') {
    const addPeriodBtn = document.getElementById('btn-add-period');
    if (addPeriodBtn) addPeriodBtn.onclick = addPeriodRow;
    const addCatBtn = document.getElementById('btn-add-category');
    if (addCatBtn) addCatBtn.onclick = addCategoryRow;
    document.querySelectorAll('[data-p-idx]').forEach((input) => input.addEventListener('change', () => savePeriodField(Number(input.dataset.pIdx), input.dataset.pField, input.value)));
    document.querySelectorAll('[data-del-period]').forEach((btn) => { btn.onclick = () => deletePeriod(btn.dataset.delPeriod); });
    document.querySelectorAll('[data-toggle-lock]').forEach((btn) => { btn.onclick = () => toggleLock(btn.dataset.toggleLock); });
    document.querySelectorAll('[data-c-idx]').forEach((input) => input.addEventListener('change', () => saveCategoryField(Number(input.dataset.cIdx), input.dataset.cField, input.value)));
    document.querySelectorAll('[data-del-category]').forEach((btn) => { btn.onclick = () => deleteCategory(btn.dataset.delCategory); });
    const addAliasBtn = document.getElementById('btn-add-alias');
    if (addAliasBtn) addAliasBtn.onclick = addAliasRow;
    const applyAliasBtn = document.getElementById('btn-apply-aliases');
    if (applyAliasBtn) applyAliasBtn.onclick = applyAliasesToExisting;
    document.querySelectorAll('[data-a-idx]').forEach((input) => input.addEventListener('change', () => saveAliasField(Number(input.dataset.aIdx), input.dataset.aField, input.value)));
    document.querySelectorAll('[data-del-alias]').forEach((btn) => { btn.onclick = () => deleteAlias(btn.dataset.delAlias); });
    const addKhoaAliasBtn = document.getElementById('btn-add-khoa-alias');
    if (addKhoaAliasBtn) addKhoaAliasBtn.onclick = addKhoaAliasRow;
    const applyKhoaAliasBtn = document.getElementById('btn-apply-khoa-aliases');
    if (applyKhoaAliasBtn) applyKhoaAliasBtn.onclick = applyKhoaAliasesToExisting;
    document.querySelectorAll('[data-ka-idx]').forEach((input) => input.addEventListener('change', () => saveKhoaAliasField(Number(input.dataset.kaIdx), input.dataset.kaField, input.value)));
    document.querySelectorAll('[data-del-khoa-alias]').forEach((btn) => { btn.onclick = () => deleteKhoaAlias(btn.dataset.delKhoaAlias); });
  }
  if (state.tab === 'trash') {
    document.querySelectorAll('[data-restore-line]').forEach((btn) => { btn.onclick = () => restoreLine(btn.dataset.restoreLine); });
    document.querySelectorAll('[data-purge-line]').forEach((btn) => { btn.onclick = () => permanentlyDeleteLine(btn.dataset.purgeLine); });
    const emptyBtn = document.getElementById('btn-empty-trash');
    if (emptyBtn) emptyBtn.onclick = emptyOldTrash;
  }
  if (state.tab === 'reference') {
    const searchEl = document.getElementById('ref-search');
    if (searchEl) {
      searchEl.addEventListener('input', (e) => { state.refSearch = e.target.value; renderTab(); });
      const val = searchEl.value; searchEl.focus(); searchEl.value = ''; searchEl.value = val;
    }
    const groupEl = document.getElementById('ref-group');
    if (groupEl) groupEl.onchange = (e) => { state.refGroup = e.target.value; renderTab(); };
    const sourceEl = document.getElementById('ref-source');
    if (sourceEl) sourceEl.onchange = (e) => { state.refSource = e.target.value; renderTab(); };
    const addBtn = document.getElementById('btn-ref-add');
    if (addBtn) addBtn.onclick = () => { state.refAdding = true; state.refEditingId = null; renderTab(); };
    document.querySelectorAll('[data-ref-toggle]').forEach((btn) => { btn.onclick = () => { const id = btn.dataset.refToggle; if (state.refExpanded.has(id)) state.refExpanded.delete(id); else state.refExpanded.add(id); renderTab(); }; });
    document.querySelectorAll('[data-ref-edit]').forEach((btn) => { btn.onclick = () => { state.refEditingId = Number(btn.dataset.refEdit); state.refAdding = false; renderTab(); }; });
    document.querySelectorAll('[data-ref-delete]').forEach((btn) => { btn.onclick = () => deleteReferenceItem(Number(btn.dataset.refDelete)); });
    document.querySelectorAll('[data-ref-cancel]').forEach((btn) => { btn.onclick = () => { state.refAdding = false; state.refEditingId = null; renderTab(); }; });
    document.querySelectorAll('[data-ref-save]').forEach((btn) => { btn.onclick = () => saveReferenceForm(btn.dataset.refSave); });
  }
}

// BẢO VỆ DỮ LIỆU: khoá kì, xác thực mật khẩu, xoá mềm (thùng rác)
// ---------------------------------------------------------------
function isLocked(quarter, year) {
  const p = state.periods.find((x) => x.quarter === quarter && x.year === year);
  return !!(p && p.locked);
}
// Bắt nhập lại mật khẩu tài khoản để xác nhận thao tác trên dữ liệu đã khoá.
// Xác thực thật (không phải chỉ hỏi cho có) bằng cách đăng nhập lại qua Supabase.
async function confirmPassword(actionLabel) {
  const pw = prompt(`Dữ liệu thuộc kì đã KHOÁ. Nhập lại mật khẩu tài khoản (${state.user.email}) để xác nhận ${actionLabel}:`);
  if (!pw) return false;
  const { error } = await sb.auth.signInWithPassword({ email: state.user.email, password: pw });
  if (error) { alert('Sai mật khẩu — thao tác đã bị huỷ.'); return false; }
  return true;
}
// Nếu bất kỳ dòng nào trong danh sách thuộc kì đã khoá, bắt xác thực mật khẩu 1 lần cho cả lô.
async function checkLockedRows(rows, actionLabel) {
  const hasLocked = rows.some((l) => isLocked(l.quarter, l.year));
  if (!hasLocked) return true;
  return await confirmPassword(actionLabel);
}

async function saveLineField(id, field, value) {
  const row = state.lines.find((l) => String(l.id) === String(id));
  if (row && isLocked(row.quarter, row.year)) {
    const ok = await confirmPassword('sửa dữ liệu kì đã khoá');
    if (!ok) { renderTab(); return; }
  }
  const patch = { [field]: field === 'year' ? Number(value) : field === 'cost' ? parseMoney(value) : value };
  await sb.from('bhyt_lines').update(patch).eq('id', id);
  if (row) Object.assign(row, patch);
}

async function deleteLineRow(id) {
  const row = state.lines.find((l) => String(l.id) === String(id));
  if (!row) return;
  if (isLocked(row.quarter, row.year)) {
    const ok = await confirmPassword('xoá 1 dòng thuộc kì đã khoá');
    if (!ok) return;
  } else {
    if (!confirm('Chuyển dòng này vào thùng rác? Có thể khôi phục lại trong 30 ngày.')) return;
  }
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.trash.push({ ...row, deleted_at: new Date().toISOString() });
  state.lines = state.lines.filter((l) => String(l.id) !== String(id));
  renderTab();
}

async function bulkDeleteVisibleLines() {
  const rows = visibleDetailRows();
  if (rows.length === 0) return;
  const okLock = await checkLockedRows(rows, `xoá ${rows.length} dòng đang hiển thị (có dòng thuộc kì đã khoá)`);
  if (!okLock) return;

  const distinctKis = Array.from(new Set(rows.map((r) => qKey(r.quarter, r.year))));
  if (distinctKis.length > 1) {
    const typed = prompt(`CẢNH BÁO: ${rows.length} dòng này trải trên ${distinctKis.length} kì khác nhau (${distinctKis.join(', ')}). Đây là thao tác dễ nhầm phạm vi — gõ đúng chữ XOÁ (in hoa) để xác nhận chuyển vào thùng rác:`);
    if (typed !== 'XOÁ') { alert('Đã huỷ, không có gì bị xoá.'); return; }
  } else {
    if (!confirm(`Chuyển ${rows.length} dòng đang hiển thị vào thùng rác? Có thể khôi phục lại trong 30 ngày.`)) return;
  }

  const ids = rows.map((r) => r.id);
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).in('id', ids);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  const idSet = new Set(ids.map(String));
  const now = new Date().toISOString();
  state.trash = state.trash.concat(rows.map((r) => ({ ...r, deleted_at: now })));
  state.lines = state.lines.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function deleteBlankLines() {
  const rows = blankLines();
  if (rows.length === 0) return;
  const okLock = await checkLockedRows(rows, `xoá ${rows.length} dòng trống (có dòng thuộc kì đã khoá)`);
  if (!okLock) return;
  if (!confirm(`Chuyển ${rows.length} dòng trống vào thùng rác? Có thể khôi phục lại trong 30 ngày.`)) return;
  const ids = rows.map((r) => r.id);
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).in('id', ids);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  const idSet = new Set(ids.map(String));
  const now = new Date().toISOString();
  state.trash = state.trash.concat(rows.map((r) => ({ ...r, deleted_at: now })));
  state.lines = state.lines.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function restoreLine(id) {
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('Lỗi khi khôi phục: ' + error.message); return; }
  const row = state.trash.find((l) => String(l.id) === String(id));
  if (row) { row.deleted_at = null; state.lines.push(row); }
  state.trash = state.trash.filter((l) => String(l.id) !== String(id));
  renderTab();
}
async function permanentlyDeleteLine(id) {
  if (!confirm('Xoá VĨNH VIỄN dòng này khỏi thùng rác? Không thể khôi phục lại được nữa.')) return;
  const { error } = await sb.from('bhyt_lines').delete().eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.trash = state.trash.filter((l) => String(l.id) !== String(id));
  renderTab();
}
async function emptyOldTrash() {
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
  const cutoff = Date.now() - THIRTY_DAYS;
  const oldIds = state.trash.filter((l) => new Date(l.deleted_at).getTime() < cutoff).map((l) => l.id);
  if (oldIds.length === 0) { alert('Chưa có mục nào trong thùng rác quá 30 ngày.'); return; }
  if (!confirm(`Xoá VĨNH VIỄN ${oldIds.length} dòng đã nằm trong thùng rác quá 30 ngày? Không thể khôi phục lại.`)) return;
  const { error } = await sb.from('bhyt_lines').delete().in('id', oldIds);
  if (error) { alert('Lỗi khi dọn thùng rác: ' + error.message); return; }
  const idSet = new Set(oldIds.map(String));
  state.trash = state.trash.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function addLineRow() {
  const payload = { quarter: 'Q1', year: new Date().getFullYear(), individual: '', department: '', cost: 0, service: '', error_desc: '', code: '', cause: null, remediator: '', link_code: '' };
  const { data, error } = await sb.from('bhyt_lines').insert(payload).select().single();
  if (!error) { state.lines.push(data); renderTab(); }
}

async function savePeriodField(idx, field, value) {
  const p = state.periods[idx];
  const patch = { [field]: field === 'quarter' ? value : field === 'revenue' ? parseMoney(value) : Number(value) };
  await sb.from('bhyt_periods').update(patch).eq('id', p.id);
  Object.assign(p, patch);
}
async function deletePeriod(id) {
  await sb.from('bhyt_periods').delete().eq('id', id);
  state.periods = state.periods.filter((p) => String(p.id) !== String(id));
  renderTab();
}
async function toggleLock(id) {
  const p = state.periods.find((x) => String(x.id) === String(id));
  if (!p) return;
  if (p.locked) {
    // Mở khoá — cần xác nhận mật khẩu vì đây là bước "mở cửa" cho phép sửa/xoá trở lại
    const ok = await confirmPassword(`mở khoá kì ${p.quarter}/${p.year}`);
    if (!ok) return;
  }
  const newLocked = !p.locked;
  const { error } = await sb.from('bhyt_periods').update({ locked: newLocked }).eq('id', id);
  if (error) { alert('Lỗi: ' + error.message); return; }
  p.locked = newLocked;
  renderTab();
}
async function addPeriodRow() {
  const existing = new Set(state.periods.map((p) => qKey(p.quarter, p.year)));
  let quarter = null, year = null;
  outer:
  for (let y = new Date().getFullYear(); y <= new Date().getFullYear() + 1; y++) {
    for (const q of QUARTERS) {
      if (!existing.has(qKey(q, y))) { quarter = q; year = y; break outer; }
    }
  }
  if (!quarter) { alert('Không tìm được kỳ trống để thêm (đã có đủ Q1-Q4 của 2 năm gần đây). Hãy sửa trực tiếp 1 dòng đã có.'); return; }
  const payload = { quarter, year, revenue: 0 };
  const { data, error } = await sb.from('bhyt_periods').insert(payload).select().single();
  if (error) { alert('Lỗi khi thêm kỳ: ' + error.message); return; }
  state.periods.push(data);
  renderTab();
}
async function saveCategoryField(idx, field, value) {
  const c = state.categories[idx];
  await sb.from('bhyt_categories').update({ [field]: value }).eq('code', c.code);
  c[field] = value;
}
async function deleteCategory(code) {
  await sb.from('bhyt_categories').delete().eq('code', code);
  state.categories = state.categories.filter((c) => c.code !== code);
  renderTab();
}
async function addCategoryRow() {
  const { data, error } = await sb.from('bhyt_categories').insert({ code: '', name: '', category_group: '' }).select().single();
  if (!error) { state.categories.push(data); renderTab(); }
}

async function saveAliasField(idx, field, value) {
  const a = state.codeAliases[idx];
  if (field === 'alias_code') {
    // alias_code là khoá chính — đổi tên nghĩa là xoá dòng cũ, tạo dòng mới
    const { error } = await sb.from('bhyt_code_aliases').delete().eq('alias_code', a.alias_code);
    if (error) { alert('Lỗi: ' + error.message); return; }
    const { data, error: err2 } = await sb.from('bhyt_code_aliases').insert({ alias_code: value, canonical_code: a.canonical_code, note: a.note }).select().single();
    if (err2) { alert('Lỗi: ' + err2.message); return; }
    state.codeAliases[idx] = data;
    renderTab();
    return;
  }
  await sb.from('bhyt_code_aliases').update({ [field]: value }).eq('alias_code', a.alias_code);
  a[field] = value;
}
async function deleteAlias(aliasCode) {
  await sb.from('bhyt_code_aliases').delete().eq('alias_code', aliasCode);
  state.codeAliases = state.codeAliases.filter((a) => a.alias_code !== aliasCode);
  renderTab();
}
async function addAliasRow() {
  const aliasCode = prompt('Mã kỳ này (mã cần quy đổi):');
  if (!aliasCode) return;
  const canonicalCode = prompt('Quy về mã chuẩn nào?');
  if (!canonicalCode) return;
  const { data, error } = await sb.from('bhyt_code_aliases').insert({ alias_code: aliasCode.trim(), canonical_code: canonicalCode.trim(), note: '' }).select().single();
  if (error) { alert('Lỗi khi thêm: ' + error.message); return; }
  state.codeAliases.push(data);
  renderTab();
}
async function applyAliasesToExisting() {
  if (state.codeAliases.length === 0) { alert('Chưa có ánh xạ nào để áp dụng.'); return; }
  if (!confirm(`Áp dụng ${state.codeAliases.length} ánh xạ cho toàn bộ dữ liệu đã có? Các dòng có mã trùng "Mã kỳ này" sẽ được đổi thành "Mã chuẩn" tương ứng. Không thể hoàn tác.`)) return;
  let totalUpdated = 0;
  for (const a of state.codeAliases) {
    const { error, count } = await sb.from('bhyt_lines').update({ code: a.canonical_code }, { count: 'exact' }).eq('code', a.alias_code);
    if (error) { alert(`Lỗi khi áp dụng ánh xạ ${a.alias_code} → ${a.canonical_code}: ` + error.message); continue; }
    totalUpdated += count || 0;
  }
  await loadAll();
  alert(`Đã cập nhật ${totalUpdated} dòng theo ánh xạ.`);
  renderTab();
}

// ---------------------------------------------------------------
function readReferenceForm() {
  const box = document.querySelector('[data-ref-form-id]');
  const get = (f) => box.querySelector(`[data-rf="${f}"]`)?.value?.trim() || '';
  return { name: get('name'), source: get('source') || 'DKTK', phu_luc: get('phu_luc'), category_group: get('category_group'), legal_basis: get('legal_basis'), payment_basis: get('payment_basis'), audit_rule: get('audit_rule'), note: get('note') };
}
async function saveReferenceForm(idOrNew) {
  const payload = readReferenceForm();
  if (!payload.name) { alert('Vui lòng nhập tên chuyên đề.'); return; }
  if (idOrNew === 'new') {
    const { data, error } = await sb.from('bhyt_reference').insert(payload).select().single();
    if (error) { alert('Lỗi khi thêm: ' + error.message); return; }
    state.reference.push(data);
    state.refAdding = false;
  } else {
    const id = Number(idOrNew);
    const { error } = await sb.from('bhyt_reference').update(payload).eq('id', id);
    if (error) { alert('Lỗi khi lưu: ' + error.message); return; }
    const row = state.reference.find((r) => r.id === id);
    if (row) Object.assign(row, payload);
    state.refEditingId = null;
  }
  renderTab();
}
async function deleteReferenceItem(id) {
  if (!confirm('Xoá chuyên đề này khỏi bảng tra cứu?')) return;
  const { error } = await sb.from('bhyt_reference').delete().eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.reference = state.reference.filter((r) => r.id !== id);
  renderTab();
}

// ---------------------------------------------------------------
// IMPORT / EXPORT EXCEL
// ---------------------------------------------------------------
function dedupeBy(rows, keyFn) {
  const map = new Map();
  rows.forEach((r) => map.set(keyFn(r), r));
  return Array.from(map.values());
}
async function handleImport(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = (name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }) : [];

    const lineRows = sheet('Chi tiết xuất toán')
      .map((r) => ({
        quarter: normalizeQuarter(r['Quý']), year: Number(r['Năm']) || null,
        individual: String(r['Họ tên người thực hiện/CĐ'] || '').trim(),
        department: String(r['Khoa'] || '').trim(),
        cost: Number(r['Chi phí']) || 0,
        service: String(r['Dịch vụ'] || '').trim(),
        error_desc: String(r['Lỗi'] || '').trim(),
        code: resolveCode(String(r['Phụ lục'] || '').trim()),
        cause: String(r['Nguyên nhân'] || '').trim() || null,
        remediator: String(r['Người khắc phục'] || r['Phụ trách khắc phục chính'] || '').trim(),
        link_code: String(r['Mã LK'] || '').trim(),
      }))
      .filter((r) => r.quarter && r.year);

    const periodRows = sheet('Doanh thu BHYT')
      .map((r) => ({ quarter: normalizeQuarter(r['Quý']), year: Number(r['Năm']) || null, revenue: Number(r['Doanh thu BHYT']) || 0 }))
      .filter((r) => r.quarter && r.year);

    const catRows = dedupeBy(
      sheet('Danh mục chuyên đề')
        .map((r) => ({ code: String(r['Mã (Phụ lục)'] || r['Mã chuyên đề'] || '').trim(), name: String(r['Tên chuyên đề'] || '').trim(), category_group: String(r['Nhóm'] || '').trim() }))
        .filter((r) => r.code),
      (r) => r.code
    );

    // Tự thêm các mã Phụ lục xuất hiện trong dữ liệu chi tiết nhưng chưa có trong Danh mục chuyên đề (để không mất mã nào)
    const knownCodes = new Set(catRows.map((c) => c.code));
    const existingCodes = new Set(state.categories.map((c) => c.code)); // mã đã có sẵn trên hệ thống — không đụng tới, tránh xoá mất Nhóm đã điền trước đó
    lineRows.forEach((l) => {
      if (l.code && !knownCodes.has(l.code) && !existingCodes.has(l.code)) {
        knownCodes.add(l.code);
        catRows.push({ code: l.code, name: l.error_desc || '', category_group: '' });
      }
    });

    const dedupedPeriods = dedupeBy(periodRows, (r) => qKey(r.quarter, r.year));

    const results = [];
    if (catRows.length) results.push(['Danh mục chuyên đề', await sb.from('bhyt_categories').upsert(catRows, { onConflict: 'code' })]);
    if (dedupedPeriods.length) results.push(['Doanh thu BHYT', await sb.from('bhyt_periods').upsert(dedupedPeriods, { onConflict: 'quarter,year' })]);

    if (lineRows.length) {
      const CHUNK = 500;
      for (let i = 0; i < lineRows.length; i += CHUNK) {
        const chunk = lineRows.slice(i, i + CHUNK);
        const res = await sb.from('bhyt_lines').insert(chunk);
        results.push([`Chi tiết xuất toán (dòng ${i + 1}-${i + chunk.length})`, res]);
      }
    }

    const failed = results.filter(([, res]) => res.error);
    await loadAll();
    if (failed.length) {
      msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm">Lỗi khi ghi ${failed.map(([n]) => n).join(', ')}: ${failed.map(([, res]) => res.error.message).join(' | ')}</div></div>`;
    } else {
      msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm">Đã thêm ${lineRows.length} dòng chi tiết, ${dedupedPeriods.length} kỳ doanh thu, ${catRows.length} mã chuyên đề.</div></div>`;
    }
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm">Không đọc được file: ${escapeHtml(err.message || String(err))}</div></div>`;
  } finally {
    e.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 8000);
  }
}

function handleExport() {
  const wb = XLSX.utils.book_new();
  const lineSheet = XLSX.utils.json_to_sheet(state.lines.map((l) => ({
    'Quý': QUARTER_VN[l.quarter] || l.quarter, 'Năm': l.year, 'Họ tên người thực hiện/CĐ': l.individual,
    'Khoa': l.department, 'Chi phí': l.cost, 'Dịch vụ': l.service, 'Lỗi': l.error_desc, 'Phụ lục': l.code, 'Nguyên nhân': l.cause, 'Người khắc phục': l.remediator, 'Mã LK': l.link_code,
  })));
  XLSX.utils.book_append_sheet(wb, lineSheet, 'Chi tiết xuất toán');
  const perSheet = XLSX.utils.json_to_sheet(state.periods.map((p) => ({ 'Quý': QUARTER_VN[p.quarter] || p.quarter, 'Năm': p.year, 'Doanh thu BHYT': p.revenue })));
  XLSX.utils.book_append_sheet(wb, perSheet, 'Doanh thu BHYT');
  const catSheet = XLSX.utils.json_to_sheet(state.categories.map((c) => ({ 'Mã (Phụ lục)': c.code, 'Tên chuyên đề': c.name, 'Nhóm': c.category_group })));
  XLSX.utils.book_append_sheet(wb, catSheet, 'Danh mục chuyên đề');
  XLSX.writeFile(wb, `Xuat_toan_BHYT_export_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

init();
</script>
